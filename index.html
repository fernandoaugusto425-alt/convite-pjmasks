<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Convite Especial: Agnes faz 5 anos!">
    <meta property="og:description" content="Clique para abrir o convite e confirmar sua presença!">
    <title>Convite Agnes 5 Anos</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Nunito', sans-serif;
            background-color: #051429;
            color: #fff;
            overflow-x: hidden;
        }

        /* TELA INICIAL COM A CAPA (NOVA CONFIGURAÇÃO) */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Posiciona o botão mais para baixo */
            align-items: center;
            height: 100vh;
            text-align: center;
            z-index: 10;
            /* A capa agora é o fundo da tela inicial */
            background-image: url('capa.png.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding-bottom: 50px;
            box-sizing: border-box;
        }

        #open-btn {
            background: linear-gradient(45deg, #e3001b, #0072ce, #009944);
            border: 2px solid white;
            color: white;
            padding: 15px 40px;
            font-size: 28px;
            font-family: 'Bangers', cursive;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            transition: transform 0.2s;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* CONTEÚDO DO CONVITE (TELA 2) */
        #invitation-content {
            display: none;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            position: relative; /* Importante para os heróis flutuantes */
        }

        /* Heróis Flutuantes */
        .hero-img {
            position: absolute;
            width: 120px;
            z-index: -1;
            opacity: 0.8;
        }

        .hero-cat { top: 50px; left: -40px; transform: rotate(-15deg); }
        .hero-owl { top: 300px; right: -50px; transform: rotate(10deg); width: 140px; }
        .hero-lizard { bottom: 50px; left: -30px; transform: rotate(-5deg); width: 110px; }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 45px;
            text-shadow: 2px 2px 4px #000;
            letter-spacing: 2px;
            margin-top: 30px;
            color: #00e5ff;
        }

        .info-box {
            background: rgba(11, 26, 48, 0.95);
            border: 2px solid #0072ce;
            border-radius: 15px;
            padding: 20px;
            margin: 30px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative;
            z-index: 5; /* Mantém a caixa acima dos heróis */
        }

        .btn-maps {
            display: inline-block;
            background-color: #0072ce;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
            margin-top: 15px;
            transition: background-color 0.3s;
        }

        .btn-maps:hover { background-color: #005b9f; }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        label { font-weight: bold; color: #00e5ff; }

        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        .guests-row { display: flex; gap: 10px; }
        .guests-row div { flex: 1; }

        button[type="submit"] {
            background-color: #009944;
            color: white;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-family: 'Bangers', cursive;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        button[type="submit"]:hover { background-color: #007a36; }

        /* Ajustes para telas muito pequenas de celular */
        @media (max-width: 400px) {
            .hero-img { width: 90px; }
            .hero-owl { width: 100px; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="musica.mp3.mp3" type="audio/mpeg">
    </audio>

    <!-- TELA 1: CAPA COMO FUNDO COM BOTÃO -->
    <div id="welcome-screen">
        <button id="open-btn">Abrir Convite</button>
    </div>

    <!-- TELA 2: INFORMAÇÕES DA FESTA -->
    <div id="invitation-content">
        
        <!-- Heróis espalhados pelas laterais -->
        <!-- Certifique-se de que os nomes dos arquivos estão idênticos aos do GitHub -->
        <img src="meninogato.png" class="hero-img hero-cat" alt="Menino Gato">
        <img src="Corujita.png" class="hero-img hero-owl" alt="Corujita">
        <img src="Lagartixo.png" class="hero-img hero-lizard" alt="Lagartixo">

        <h1>AGNES FAZ 5 ANOS!</h1>
        
        <div class="info-box">
            <!-- Data atualizada -->
            <p><strong>Data:</strong> 26 de Setembro de 2026</p>
            <p><strong>Horário:</strong> 15:00 às 19:00 hrs</p>
            <p><strong>Local:</strong> Anna Festas Buffet<br>Av. Joaquim Fogaça de Almeida Neto, 541 - Jardim Fogaça<br>Itapetininga - SP</p>
            
            <a href="https://www.google.com/maps/search/?api=1&query=Anna+Festas+Buffet,+Av.+Joaquim+Fogaça+de+Almeida+Neto,+541,+Itapetininga" target="_blank" class="btn-maps">📍 Como Chegar (Ver Rota)</a>
        </div>

        <div class="info-box">
            <h2 style="font-family: 'Bangers', cursive; margin-top: 0; text-align: center;">Confirme sua presença</h2>
            
            <!-- COLOQUE SEU CÓDIGO DO FORMSPREE AQUI -->
            <form action="https://formspree.io/f/SEU_CODIGO_AQUI" method="POST">
                
                <label for="nome">Seu Nome / Família:</label>
                <input type="text" id="nome" name="Nome" required placeholder="Ex: Família Silva">

                <div class="guests-row">
                    <div>
                        <label for="adultos">Qtd Adultos:</label>
                        <input type="number" id="adultos" name="Adultos" min="1" required value="1">
                    </div>
                    <div>
                        <label for="criancas">Qtd Crianças:</label>
                        <input type="number" id="criancas" name="Crianças" min="0" required value="0">
                    </div>
                </div>

                <label for="obs">Restrição alimentar ou observação?</label>
                <textarea id="obs" name="Observações" rows="3" placeholder="Ex: Alergia a amendoim, vegano, etc..."></textarea>

                <button type="submit">Enviar Confirmação</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('open-btn').addEventListener('click', function() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('invitation-content').style.display = 'block';
            document.getElementById('bg-music').play();
            // Volta a página para o topo ao abrir o convite
            window.scrollTo(0, 0); 
        });
    </script>

</body>
</html>
