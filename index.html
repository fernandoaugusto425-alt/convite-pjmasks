<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Convite Especial: Agnes faz 5 anos!">
    <meta property="og:description" content="Clique para abrir o convite e confirmar sua presença!">
    <title>Convite Agnes 5 Anos</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Nunito', sans-serif;
            background-color: #051429; /* Fundo azul escuro para destacar a imagem */
            color: #fff;
            overflow-x: hidden;
        }

        #welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            z-index: 10;
        }

        #open-btn {
            background: linear-gradient(45deg, #e3001b, #0072ce, #009944);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 24px;
            font-family: 'Bangers', cursive;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #invitation-content {
            display: none;
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }

        /* Configuração da Imagem do Convite */
        .convite-img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            margin-bottom: 20px;
        }

        .info-box {
            background: rgba(11, 26, 48, 0.95);
            border: 2px solid #0072ce;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-maps {
            display: inline-block;
            background-color: #0072ce;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
            margin-top: 15px;
            transition: background-color 0.3s;
        }

        .btn-maps:hover {
            background-color: #005b9f;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            color: #00e5ff;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        .guests-row {
            display: flex;
            gap: 10px;
        }

        .guests-row div {
            flex: 1;
        }

        button[type="submit"] {
            background-color: #009944;
            color: white;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-family: 'Bangers', cursive;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #007a36;
        }
    </style>
</head>
<body>

    <!-- Link corrigido para a música com a extensão dupla que subiu no GitHub -->
    <audio id="bg-music" loop>
        <source src="musica.mp3.mp3" type="audio/mpeg">
    </audio>

    <div id="welcome-screen">
        <h1 style="color: white; font-family: 'Bangers', cursive; text-shadow: 2px 2px 5px black;">É hora de ser um herói!</h1>
        <button id="open-btn">Abrir Convite</button>
    </div>

    <div id="invitation-content">
        
        <!-- Link corrigido para a imagem com a extensão dupla que subiu no GitHub -->
        <img src="capa.png.png" alt="Aniversário da Agnes" class="convite-img">
        
        <div class="info-box">
            <p><strong>Data:</strong> 26 de Novembro de 2026</p>
            <p><strong>Horário:</strong> 15:00 às 19:00 hrs</p>
            <p><strong>Local:</strong> Anna Festas Buffet<br>Av. Joaquim Fogaça de Almeida Neto, 541 - Jardim Fogaça<br>Itapetininga - SP</p>
            
            <!-- Link do Google Maps já configurado e pronto -->
            <a href="https://www.google.com/maps/search/?api=1&query=Anna+Festas+Buffet,+Av.+Joaquim+Fogaça+de+Almeida+Neto,+541,+Itapetininga" target="_blank" class="btn-maps">📍 Como Chegar (Ver Rota)</a>
        </div>

        <div class="info-box">
            <h2 style="font-family: 'Bangers', cursive; margin-top: 0; text-align: center;">Confirme sua presença</h2>
            
            <!-- ATENÇÃO: Lembre-se de colar o seu código do Formspree aqui no lugar de "SEU_CODIGO_AQUI" depois -->
            <form action="https://formspree.io/f/SEU_CODIGO_AQUI" method="POST">
                
                <label for="nome">Seu Nome / Família:</label>
                <input type="text" id="nome" name="Nome" required placeholder="Ex: Família Silva">

                <div class="guests-row">
                    <div>
                        <label for="adultos">Qtd Adultos:</label>
                        <input type="number" id="adultos" name="Adultos" min="1" required value="1">
                    </div>
                    <div>
                        <label for="criancas">Qtd Crianças:</label>
                        <input type="number" id="criancas" name="Crianças" min="0" required value="0">
                    </div>
                </div>

                <label for="obs">Restrição alimentar ou observação?</label>
                <textarea id="obs" name="Observações" rows="3" placeholder="Ex: Alergia a amendoim, vegano, etc..."></textarea>

                <button type="submit">Enviar Confirmação</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('open-btn').addEventListener('click', function() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('invitation-content').style.display = 'block';
            document.getElementById('bg-music').play();
        });
    </script>

</body>
</html>
